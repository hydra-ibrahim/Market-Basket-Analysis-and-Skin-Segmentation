    <script>
        // document.getElementById('body').addEventListener('load', f())
        let url = localStorage.getItem('url')
        console.log(url)
        if (url === null) url = `${API_BASE_URL}/apriori/items/`

        // function f(url)
        // {
            fetch(url).then(response => {
            if (!response.ok) {
                throw new Error('Network response was not ok');
            }
            return response.json();
        })
            .then(data => {
                console.log(data)
                console.log(data['next'])
                // console.log(data['results'][0].name) 
                document.getElementById('previous').addEventListener('click', function ff(){localStorage.setItem('url',data['previous']); open('items.html', '_self') })
                document.getElementById('next').addEventListener('click', function ff() { localStorage.setItem('url', data['next']); open('items.html', '_self') })
                let results = data['results']

                let items_container = document.getElementById('items-container')
                let items = document.getElementById('items')

                // if (items !== null) items_container.removeChild(items)
                // items = document.createElement('div')
                // items.id = 'items'

                results.forEach(item => {
                    let img = document.createElement('img')
                    img.className = 'w-100'
                    img.src = 'img/item.png'

                    let elm3_1 = document.createElement('div')
                    // elm3_1.className = 'bg-image hover-zoom ripple ripple-surface ripple-surface-light'
                    elm3_1.setAttribute('data-mdb-ripple-color', 'light')
                    elm3_1.appendChild(img)

                    // let details = document.createElement('a')
                    // // details.href = ''
                    // details.innerText = item.name
                    // details.className = 'text-reset'

                    let productName = document.createElement('h6')
                    productName.className = 'card-title mb-3'
                    productName.innerText = item.name
                    // productName.appendChild(details)

                    let productPrice = document.createElement('h6')
                    productPrice.className = 'mb-3'
                    productPrice.innerText = `$${item.price}`
                    productPrice.style.color = 'green'

                    let card_body = document.createElement('div')
                    card_body.className = 'card-body'
                    card_body.append(productName, productPrice)

                    let card = document.createElement('div')
                    card.className = 'card'
                    card.setAttribute('itemName', item.name)
                    card.setAttribute('itemPrice', item.price)
                    card.append(elm3_1, card_body)
                    card.addEventListener('click', function (e) {
                        sessionStorage.setItem('itemName', this.getAttribute('itemname'))
                        sessionStorage.setItem('itemPrice', this.getAttribute('itemprice'))
                        // console.log(sessionStorage.getItem('itemName'), sessionStorage.getItem('itemPrice'))
                        open('item.html', '_blank')
                    })

                    let elm1 = document.createElement('div')
                    elm1.className = 'col-lg-4 col-md-12 mb-4'
                    elm1.appendChild(card)

                    items.appendChild(elm1)
                });
            })
            .catch(error => {
                console.error('Error:', error);
            });
        // }
